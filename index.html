<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Code Preview</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="description" content="Code Preview - ブラウザ上でコードを実行・プレビューする開発ツール" />
</head>
<body>\n  <nav class="breadcrumb" aria-label="パンくずリスト">
    <a href="https://mofu-mitsu.github.io/">ホーム</a>
    <span aria-hidden="true">›</span>
    <span aria-current="page">Code Preview</span>
  </nav>

  <header class="topbar">
    <div>
      <div class="brand">Code Preview</div>
      <div class="subtitle">Write code. See what it produces.</div>
    </div>
    <div class="controls">
      <select id="language" aria-label="Language">
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="javascript">JavaScript</option>
        <option value="jsx">JSX / React</option>
        <option value="tsx">TSX / React</option>
      </select>
      <button id="run" class="primary">▶ Run</button>
      <button id="reset">Reset</button>
    </div>
  </header>

  <main class="workspace">
    <section class="panel editor-panel">
      <div class="panel-head"><span>CODE</span><span id="status">Ready</span></div>
      <div id="editor"></div>
    </section>
    <section class="panel preview-panel">
      <div class="panel-head">
        <span>PREVIEW</span>
        <button id="open-new" class="mini">↗ New tab</button>
      </div>
      <iframe id="preview" sandbox="allow-scripts" title="Code preview"></iframe>
    </section>
  </main>

  <section class="console-panel">
    <div class="panel-head"><span>CONSOLE</span><button id="clear-console" class="mini">Clear</button></div>
    <pre id="console"></pre>
  </section>

  <footer>
    <span>Code Preview</span>
    <span>Browser runtime · sandboxed preview</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.10/babel.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
